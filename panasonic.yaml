esphome:
  name: panasonic-ac

esp32:
  board: nodemcu-32s

wifi:
  networks:
  ap: {}

logger:
  level: DEBUG
#  baud_rate: 0 # ESP8266 only

api:

ota:
  platform: esphome

# 9600 baud, 8 data bits, even parity and 1 stop bit are required (checked at config time)
uart:
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 9600
  parity: EVEN

external_components:
  source: github://Boilerplate4u/esphome-panasonic-ac@configurable-poll-and-swing
  components: [panasonic_ac]


climate:
  - platform: panasonic_ac
    # For CZ-TACG1
    # type: cnt

    # For DNSK-P11
    # type: wlan

    name: Panasonic AC
    horizontal_swing_select:
      name: Panasonic AC Horizontal Swing Mode
    vertical_swing_select:
      name: Panasonic AC Vertical Swing Mode
    outside_temperature:
      name: Panasonic AC Outside Temperature
    defrost_sensor:
      name: Panasonic AC Defrost Status

    # Enable as needed
    # eco_switch:
    #   name: Panasonic AC Eco Switch
    # econavi_switch:
    #   name: Panasonic AC Econavi Switch
    # nanoex_switch:
    #   name: Panasonic AC NanoeX Switch
    # mild_dry_switch:
    #   name: Panasonic AC Mild Dry Switch
    # current_power_consumption:
    #   name: Panasonic AC Power Consumption

    # Adapt according to your measurements
    # current_temperature_offset: 0
    # outside_temperature_offset: 0

    # Useful when the ac does not report a current temperature (CZ-TACG1 only)
    # current_temperature_sensor: temperature_sensor_id

    # Polling (CZ-TACG1 only), defaults shown. Set poll_interval_slow to poll less
    # often when nothing happens, e.g. 30s.
    # poll_interval_fast: 5s
    # poll_interval_slow: 5s
    # fast_poll_window: 60s

    # Simulated swing (CZ-TACG1 only): adds the option simulated_swing to the
    # swing selects. ESPHome then steps the vane through these positions, also in
    # heating mode where the AC's own auto airflow direction does not swing.
    # Defaults shown.
    # vertical_swing_interval: 10s
    # horizontal_swing_interval: 10s
    # vertical_swing_positions: [up, up_center, center, down_center, down]
    # horizontal_swing_positions: [left, left_center, center, right_center, right]
    # climate_swing: native   # or simulated: the climate entity's swing modes use the simulated swing
